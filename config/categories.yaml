category_registry:
- label: Assets
  type: parent
  allow_new_children: true
  children:
  - label: Saving Account
    description: "Transfers into or balance of the savings account (own-account transfer, opsparing)."
  - label: JEPI
    description: "JEPI ETF holding value or purchases (JPMorgan Equity Premium Income)."
  - label: OXY
    description: "OXY stock holding value or purchases (Occidental Petroleum)."
  - label: CRYPTO
    description: "Cryptocurrency holdings or purchases (e.g. Bitcoin, Ethereum, Coinbase, Binance, Kraken)."
  - label: tax return
    description: "Tax refund paid out by the tax authority (SKAT, overskydende skat)."
- label: Cashflow
  type: derived
- label: Expense claims
  description: "Work expenses paid personally and reimbursed by the employer (udlæg, refusion)."
- label: Nordea Credit Card
  description: "Payment of the Nordea credit card bill (outgoing Mastercard settlement)."
- label: Mastercard refund
  description: "Refund credited back from a Mastercard purchase (incoming card refund/credit)."
- label: Income (net)
  type: derived
- label: Full-time job (net)
  description: "Net salary paid by the employer (løn)."
- label: Labour market contribution
  type: derived
- label: Taxes
  type: derived
- label: Recurring payments
  type: derived
- label: Living expenses
  type: parent
  allow_new_children: true
  children:
  - label: Rent (monthly)
    description: "Monthly rent for the home (husleje, apartment rent)."
  - label: Mom
    description: Money transferred to mom.
  - label: Dad
    description: Money transferred to dad.
  - label: Shopping (monthly)
    description: "Clothing, household goods, electronics and other retail, e.g. H&M, Zara, Uniqlo, IKEA, Jysk, Elgiganten, Power, Matas, Normal, Søstrene Grene, Flying Tiger, Amazon, Zalando."
  - label: Food& Drinks (monthly)
    description: "Groceries and drinks from supermarkets, bakeries and kiosks, e.g. Netto, Rema 1000, Føtex, Bilka, Lidl, Aldi, Coop 365, Kvickly, SuperBrugsen, Irma, Meny, Spar, Lagkagehuset, 7-Eleven."
  - label: Lunch (monthly)
    description: "Workday lunch at the office canteen or a cafe near the office (kantine)."
  - label: Cleaning costs (monthly)
    description: "Home cleaning service and cleaning supplies (rengøring), e.g. Helpling, Happy Helper."
  - label: Traveling
    description: "Flights, hotels, holiday rentals, car rental and spending abroad on trips, e.g. SAS, Norwegian, Ryanair, easyJet, Booking.com, Airbnb, Hotels.com, Hertz, duty free."
  - label: electricity
    description: "Electricity and utility bills for the home, e.g. Ørsted, Andel Energi, Norlys, Radius, HOFOR."
  - label: transportation
    description: "Public transport, travel cards, bike and scooter rentals, taxis and fuel, e.g. Rejsekort, DSB, Movia, Metroselskabet, Voi, Lime, Donkey Republic, Bolt, Uber, Dantaxi, Circle K, Q8, Shell, OK."
  - label: Restaurants
    description: "Eating out at restaurants, cafes, bars and takeaway, e.g. Wolt, Just Eat, McDonald's, Burger King, Joe & The Juice, Espresso House, Starbucks, sushi, pizza, grill, pub; not groceries or workday lunch."
  - label: Entertainment
    description: "Cinema, concerts, events, games and other leisure, e.g. Nordisk Film Biografer, Tivoli, Ticketmaster, Billetlugen, Royal Arena, Steam, PlayStation, theatre."
- label: Services
  type: parent
  allow_new_children: true
  children:
  - label: Disney+
    description: "Disney+ streaming subscription (Disney Plus)."
  - label: Louis Nielsen
    description: "Louis Nielsen optician purchases and eyewear subscription."
  - label: Apple Cloud
    description: "Apple iCloud storage subscription (Apple.com/bill, App Store)."
  - label: Fitness center membership (monthly)
    description: "Gym or fitness center membership fee, e.g. Fitness World, SATS, PureGym, Fitness.dk."
  - label: Google Cloud
    description: "Google cloud storage or services subscription (Google One, Google Cloud, Google Workspace)."
  - label: Max (yearly)
    description: "Max streaming subscription, billed yearly (HBO Max)."
  - label: Metro (monthly)
    description: "Monthly metro or commuter pass (pendlerkort, DOT/Rejsekort commuter card)."
  - label: Akasse
    description: "Unemployment insurance fund (a-kasse) or union membership fee, e.g. Det Faglige Hus, Ase, Krifa, Ca a-kasse."
  - label: Mobile phone (monthly)
    description: "Mobile phone plan bill, e.g. CBB Mobil, Telmore, Oister, Lebara, Telia, Telenor, 3, YouSee."
  - label: Banking account fees (monthly)
    description: "Bank account and card fees (gebyr, kortgebyr)."
  - label: healthcare
    description: "Doctor, dentist, pharmacy and other health costs, e.g. Apotek, tandlæge, læge, fysioterapi, clinic."
  - label: Subscriptions
    description: Recurring digital or membership subscriptions without their own leaf.
- label: Insurance
  type: parent
  allow_new_children: true
  children:
  - label: House insurance Tryg (yearly, in Jan)
    description: "Yearly Tryg home insurance premium paid in January (indboforsikring)."
  - label: Liability insurance (yearly, in Apr)
    description: "Yearly liability insurance premium paid in April (ansvarsforsikring)."
- label: Investments
  type: parent
  allow_new_children: true
  children:
  - label: Annuity K43
    description: "Contribution to annuity pension account K43 (ratepension/pension)."
  - label: Annuity M12
    description: "Contribution to annuity pension account M12 (ratepension/pension)."
  - label: Stock investment plan
    description: "Monthly transfer into the stock investment plan (aktiesparekonto, investment savings)."
- label: Total net worth
  type: derived
