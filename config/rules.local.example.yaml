# Copy this file to `config/rules.local.yaml` for private merchant-specific rules.
# `rules.local.yaml` is ignored by Git and should contain only local personal data.

historical_mappings:
  "PRIVATE MERCHANT EXAMPLE": "Shopping (monthly)"

rules:
  - category: "Food& Drinks (monthly)"
    match_keywords: ["private grocery example"]
    direction: "expense"
    confidence: 0.95

recurring_rules:
  - category: "Mobile phone (monthly)"
    amount: "99.00"
    amount_tolerance: "5.00"
    day_min: 1
    day_max: 10
    match_keywords: ["private telecom example"]
    direction: "expense"
    confidence: 0.95

fixed_rows: []

# Optional: split one private intermediary transfer into explicit tracker allocations.
# Keep real intermediary names, fixed amounts, and personal categories in rules.local.yaml.
proxy_split_rules:
  - name: "private_family_transfer_example"
    match_keywords: ["private intermediary example"]
    direction: "expense"
    conversion_rate: "0.82"
    monthly_limit: 1
    allocations:
      - role: "parent_a"
        category: "Parent A"
        base_amount: "8000"
      - role: "parent_b"
        category: "Parent B"
        base_amount: "4000"
